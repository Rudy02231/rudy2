function applyFilters(){
  var q=document.getElementById('search').value.toLowerCase();
  var owners=getSelected('ownerFilter');
  var teams=getSelected('teamFilter');
  var cats=getSelected('cat1Filter');
  var dateStart=document.getElementById('thKwDate-start').value;
  var dateEnd=document.getElementById('thKwDate-end').value;
  state.filtered=RAW.filter(function(r){
    if(owners.length&&!owners.includes(r['活动管理主体']))return false;
    if(teams.length&&!teams.includes(r['商管团队']))return false;
    if(cats.length&&!cats.includes(r['一级类目']))return false;
    if(dateStart||dateEnd){
      var d=(r['创建时间']||'').slice(0,10);
      if(dateStart&&d<dateStart)return false;
      if(dateEnd&&d>dateEnd)return false;
    }
    if(q&&!((r['活动标题']||'').toLowerCase().includes(q)||t(r['活动标题'],curLang).toLowerCase().includes(q)||(r['活动管理主体']||'').toLowerCase().includes(q)||t(r['活动管理主体'],curLang).toLowerCase().includes(q)||(r['类目']||'').toLowerCase().includes(q)||t(r['类目'],curLang).toLowerCase().includes(q)||(r['活动ID']||'').includes(q)))return false;
    for(var kid in thKwFields){var inp=document.getElementById(kid+'-input');var v=inp&&inp.value.trim().toLowerCase();if(v&&!(r[thKwFields[kid]]||'').toLowerCase().includes(v)&&!t(r[thKwFields[kid]],curLang).toLowerCase().includes(v))return false;}
    return true;
  });
  state.curPage=1;renderPage();

  if (sortDir === 1) {
    state.filtered.sort(function(a, b) {
      var ta = a['创建时间'] || '';
      var tb = b['创建时间'] || '';
      return tb.localeCompare(ta);
    });
  } else if (sortDir === 2) {
    state.filtered.sort(function(a, b) {
      var ta = a['创建时间'] || '';
      var tb = b['创建时间'] || '';
      return ta.localeCompare(tb);
    });
  }
}

<script>
(function(){
  var overlay=document.getElementById("ratingOverlay");
  var rated=localStorage.getItem("spmb_rating_done");
  if(rated){var ts=parseInt(rated,10);if(ts>0||Date.now()<ts)return;}
  setTimeout(function(){if(overlay)overlay.classList.add("active");},40000);
  var stars=document.querySelectorAll(".rating-stars .star");
  var selectedVal=0;
  stars.forEach(function(star){
    star.addEventListener("mouseenter",function(){
      if(selectedVal>0)return;
      var val=parseInt(this.dataset.val,10);
      stars.forEach(function(s){s.classList.toggle("hover",parseInt(s.dataset.val,10)<=val);});
    });
    star.addEventListener("mouseleave",function(){stars.forEach(function(s){s.classList.remove("hover");});});
    star.addEventListener("click",function(){
      selectedVal=parseInt(this.dataset.val,10);
      stars.forEach(function(s){s.classList.toggle("selected",parseInt(s.dataset.val,10)<=selectedVal);});
      if(window.clarity)window.clarity("event","page_rating",{rating:String(selectedVal)});
      localStorage.setItem("spmb_rating_done",String(Date.now()));
      alert("感谢反馈！（"+selectedVal+"星）");
      setTimeout(function(){overlay.classList.remove("active");},800);
    });
  });
  document.getElementById("ratingDismiss").addEventListener("click",function(){
    localStorage.setItem("spmb_rating_done",String(Date.now()+7*86400*1000));
    overlay.classList.remove("active");
  });
})();

var sortDir = 0; // 0: none, 1: desc, 2: asc
function toggleSortByTime() {
  sortDir = (sortDir === 1) ? 2 : 1; // toggle between desc and asc
  var indicator = document.getElementById('sortIndicator');
  if (sortDir === 1) {
    indicator.textContent = '▼';
    indicator.style.opacity = '1';
    state.filtered.sort(function(a, b) {
      var ta = a['创建时间'] || '';
      var tb = b['创建时间'] || '';
      return tb.localeCompare(ta); // descending
    });
  } else {
    indicator.textContent = '▲';
    indicator.style.opacity = '1';
    state.filtered.sort(function(a, b) {
      var ta = a['创建时间'] || '';
      var tb = b['创建时间'] || '';
      return ta.localeCompare(tb); // ascending
    });
  }
  state.curPage = 1;
  renderPage();
}
